<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grove Host</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <div class="brand"><img alt="" src="grove.svg" />grove</div>
      <span>Host desktop</span>
    </header>
    <main>
      <h1>Local runner<span>.</span></h1>
      <p class="intro">Run a small Python job on this machine and verify its output.</p>
      <section aria-labelledby="job-title">
        <div class="field">
          <div class="circuit" aria-hidden="true"><i></i><b>G</b><i></i></div>
          <span id="status" role="status">Connecting</span>
        </div>
        <div class="body">
          <h2 id="job-title">Checksum test</h2>
          <p>Hash an 8 MiB sample inside a temporary Linux container.</p>
          <dl>
            <div>
              <dt>CPU limit</dt>
              <dd>2 cores</dd>
            </div>
            <div>
              <dt>Memory limit</dt>
              <dd>2 GiB</dd>
            </div>
            <div>
              <dt>Time limit</dt>
              <dd>15 min</dd>
            </div>
          </dl>
          <div class="actions">
            <button id="action" disabled>Connecting…</button
            ><button id="save" hidden>Save result</button>
          </div>
          <p id="detail" aria-live="polite"></p>
        </div>
      </section>
    </main>
  </body>
</html>
