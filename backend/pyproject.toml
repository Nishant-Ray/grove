[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grove-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.27,<1", "email-validator>=2,<3", "python-dotenv>=1,<2", "stripe>=14,<15"]

[tool.setuptools]
packages = ["app"]
